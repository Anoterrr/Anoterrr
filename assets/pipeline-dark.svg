<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 890 175" role="img" aria-label="Records flow from landing through bronze, silver and gold. One fails a quality gate and drops into quarantine.">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ok  { animation: flow 7s linear infinite; }
  .bad { animation: reject 7s ease-in-out infinite; }
  @keyframes flow   { 0% { transform: translateX(0); opacity: 0; } 5% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(590px); opacity: 0; } }
  @keyframes reject { 0% { transform: translate(0,0); opacity: 0; } 5% { opacity: 1; } 30% { transform: translate(55px,0); }
                       45% { transform: translate(55px,0); } 65% { transform: translate(55px,95px); opacity: 1; } 90% { transform: translate(55px,95px); opacity: 1; } 100% { transform: translate(55px,95px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ok, .bad { animation: none; } .bad { transform: translate(55px,95px); } }
</style>
<line x1="150" y1="88" x2="740" y2="88" stroke="#30363d" stroke-width="2"/>
<rect x="20" y="64" width="130" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="85.0" y="93" text-anchor="middle" font-size="15" fill="#e6edf3">landing</text>
<rect x="260" y="64" width="130" height="48" rx="10" fill="#161b22" stroke="#c07a3e" stroke-width="2"/>
<text x="325.0" y="93" text-anchor="middle" font-size="15" fill="#e6edf3">bronze</text>
<rect x="500" y="64" width="130" height="48" rx="10" fill="#161b22" stroke="#9aa4ae" stroke-width="2"/>
<text x="565.0" y="93" text-anchor="middle" font-size="15" fill="#e6edf3">silver</text>
<rect x="740" y="64" width="130" height="48" rx="10" fill="#161b22" stroke="#d4a72c" stroke-width="2"/>
<text x="805.0" y="93" text-anchor="middle" font-size="15" fill="#e6edf3">gold</text>
<rect x="202" y="70" width="6" height="36" rx="3" fill="#3fb950"/>
<text x="205" y="62" text-anchor="middle" font-size="11" fill="#7d8590">check</text>
<rect x="442" y="70" width="6" height="36" rx="3" fill="#3fb950"/>
<text x="445" y="62" text-anchor="middle" font-size="11" fill="#7d8590">check</text>
<rect x="682" y="70" width="6" height="36" rx="3" fill="#3fb950"/>
<text x="685" y="62" text-anchor="middle" font-size="11" fill="#7d8590">check</text>
<line x1="205" y1="106" x2="205" y2="166" stroke="#f85149" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="145" y="166" width="120" height="36" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="205" y="189" text-anchor="middle" font-size="13" fill="#e6edf3">quarantine</text>
<circle class="ok" cx="150" cy="88" r="6" fill="#3fb950" style="animation-delay:0s"/>
<circle class="ok" cx="150" cy="88" r="6" fill="#3fb950" style="animation-delay:-2.33s"/>
<circle class="ok" cx="150" cy="88" r="6" fill="#3fb950" style="animation-delay:-4.66s"/>
<circle class="bad" cx="150" cy="88" r="6" fill="#f85149" style="animation-delay:-1s"/>
<text x="870" y="189" text-anchor="end" font-size="13" fill="#7d8590">bad data stops here. everything else moves on.</text>
</svg>
